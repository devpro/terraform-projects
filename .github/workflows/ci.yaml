name: CI
# title: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@d91ef67d46ca6d756055bdd1b8f9c65182bdad23

  terraform-quality:
    name: Terraform
    uses: devpro/github-workflow-parts/.github/workflows/reusable-terraform-quality.yml@d91ef67d46ca6d756055bdd1b8f9c65182bdad23
    with:
      workflow-parts-version: d91ef67d46ca6d756055bdd1b8f9c65182bdad23
