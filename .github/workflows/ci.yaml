name: CI
# title: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@3b7272fb3f5ef967f4d0a9380f1ac58c7d07a747

  terraform-quality:
    name: Terraform
    uses: devpro/github-workflow-parts/.github/workflows/reusable-terraform-quality.yml@3b7272fb3f5ef967f4d0a9380f1ac58c7d07a747
    with:
      workflow-parts-version: 3b7272fb3f5ef967f4d0a9380f1ac58c7d07a747
