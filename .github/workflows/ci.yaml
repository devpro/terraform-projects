name: CI
# title: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@6067fa77d9a40a8f7cc4aac6af29ae737b23ed91

  terraform-quality:
    name: Terraform
    uses: devpro/github-workflow-parts/.github/workflows/reusable-terraform-quality.yml@6067fa77d9a40a8f7cc4aac6af29ae737b23ed91
    with:
      workflow-parts-version: 6067fa77d9a40a8f7cc4aac6af29ae737b23ed91
