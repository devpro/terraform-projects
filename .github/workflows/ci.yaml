name: CI
# title: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@3fcf4f1a28d8afdc1c49d230ff51a0c0277fb799

  terraform-quality:
    name: Terraform
    uses: devpro/github-workflow-parts/.github/workflows/reusable-terraform-quality.yml@3fcf4f1a28d8afdc1c49d230ff51a0c0277fb799
    with:
      workflow-parts-version: 3fcf4f1a28d8afdc1c49d230ff51a0c0277fb799
