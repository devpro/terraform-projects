name: CI
# title: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@02f21d323e4a661cc6f097f78965d6bb83823068

  terraform-quality:
    name: Terraform
    uses: devpro/github-workflow-parts/.github/workflows/reusable-terraform-quality.yml@02f21d323e4a661cc6f097f78965d6bb83823068
    with:
      workflow-parts-version: 02f21d323e4a661cc6f097f78965d6bb83823068
