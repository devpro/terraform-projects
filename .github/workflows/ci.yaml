name: CI
# title: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@dcd6db5002f8226dee5afc1291263d90de4bca7b

  terraform-quality:
    name: Terraform
    uses: devpro/github-workflow-parts/.github/workflows/reusable-terraform-quality.yml@dcd6db5002f8226dee5afc1291263d90de4bca7b
    with:
      workflow-parts-version: dcd6db5002f8226dee5afc1291263d90de4bca7b
